<!doctype html>
<html lang="en">
<head>

<title>Vampire Simulator: 3D asset preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #e8e4da; }
  canvas { display: block; }
  #panel { position: fixed; top: 10px; left: 10px; background: rgba(18, 16, 22, .82); border: 1px solid #4b3f2c; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; max-width: 260px; }
  #panel label { display: flex; gap: 6px; align-items: center; }
  #panel select { background: #221d27; color: inherit; border: 1px solid #4b3f2c; border-radius: 4px; padding: 2px 4px; }
  #stats, #hint { color: #a99f8c; font-size: 12px; }
  #status { color: #f0c36a; }
  #loading { position: fixed; inset: 0; z-index: 10; background: #0d0f14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .6s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0; font: 600 28px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .04em; color: #e8e4da; }
  #loading .bar { width: min(320px, 70vw); height: 6px; background: #221d27; border: 1px solid #4b3f2c; border-radius: 4px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0; background: #b3141c; transition: width .2s ease; }
  #loadText { color: #a99f8c; font-size: 12px; min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { #loading, #loading .fill { transition: none; } }
  #panel .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #panel button { background: #221d27; color: inherit; border: 1px solid #4b3f2c; border-radius: 4px; padding: 1px 8px; font: inherit; cursor: pointer; }
  #panel button:focus-visible { outline: 2px solid #f0c36a; }
  #panel.min { padding: 4px; background: rgba(18, 16, 22, .45); border-color: transparent; }
  #panel.min > :not(.head), #panel.min strong { display: none; }
</style>

<body>
<div id="loading" role="status" aria-live="polite">

</div>
<div id="panel" class="min">
  <div class="head"><strong>3D asset preview</strong><button id="panelToggle" type="button" title="Hide or show the settings (H)" aria-expanded="false">Settings</button></div>
  <label>Angle <input type="range" id="camAngle" min="15" max="89" step="1" value="29" style="flex:1"></label>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// World: 1 unit is 1 metre. +X is east, +Z is south, so buildings face +Z like the game's south-facing homes.
const RIVER_HALF = 6.94, ROAD_HALF = 3.375, BRIDGE_HALF = 3.75, GROUND = 170;
const M = 'assets/models/', T = 'assets/textures/';

const renderer = new THREE.WebGLRenderer({ antialias: true });
const MAX_SCALE = Math.min(devicePixelRatio, 1.5);
let renderScale = Math.min(MAX_SCALE, 1);   // start modest; adaptResolution raises it when frames have headroom
renderer.setPixelRatio(renderScale);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 900);
camera.position.set(8, 48 * Math.sin(29 * Math.PI / 180), 4 + 48 * Math.cos(29 * Math.PI / 180));   // 29 degrees down, 48 m from the point looked at
const controls = new OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = false;   // right-drag slides the view over the ground, never up into the sky
controls.enableZoom = false;   // the wheel does nothing; the Zoom slider sets the distance
controls.target.set(8, 0, 4);
controls.maxPolarAngle = Math.PI * 0.47;   // stops a little above eye level, so the camera never dips under a rise
controls.minDistance = 4;
controls.maxDistance = 320;
controls.update();

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4a5a34, 1.0);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(-70, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 400 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.05;
scene.add(hemi, sun, sun.target);

// ---- Night sky: a transparent half dome of twinkling stars around the point the camera looks at ----
// Each star has its own size, brightness, tint and shimmer rate. uNight (0 by day, 1 at night) fades them in.
// They live in their own scene, drawn after the tilt-shift blur (which would wipe out points this small) and
// depth-tested against the town, so the ground still hides them.
const skyScene = new THREE.Scene();
const waterUniforms = { uTime: { value: 0 }, uHalf: { value: RIVER_HALF }, uSky: { value: new THREE.Color() } };
const starUniforms = { uTime: { value: 0 }, uNight: { value: 0 }, uPixel: { value: 1 } };
const stars = (() => {
  const N = 2400, R = 600, pos = new Float32Array(N * 3), seed = new Float32Array(N * 4), tint = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    // From 25 degrees below the horizon to the zenith. The camera never looks far above the horizon, so the sky it
    // shows is mostly the backdrop past the edge of the ground; the ground hides the low stars everywhere else.
    // Most stars go in that low band, where they can be seen.
    const LOW = Math.sin(-25 * Math.PI / 180), BAND = Math.sin(20 * Math.PI / 180);
    const y = i < N * 0.8 ? LOW + Math.random() * (BAND - LOW) : BAND + Math.random() * (1 - BAND);
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - y * y);
    pos.set([Math.cos(a) * r * R, y * R, Math.sin(a) * r * R], i * 3);
    const bright = Math.pow(Math.random(), 3);   // mostly faint, a few bright
    seed.set([1.2 + 1.6 * bright, 1.3 + 3.2 * bright, 0.6 + Math.random() * 2.6, Math.random() * Math.PI * 2], i * 4);   // size px, brightness, twinkle rate, phase
    const warm = Math.random();
    tint.set(warm < 0.15 ? [1, 0.85, 0.7] : warm > 0.8 ? [0.75, 0.85, 1] : [1, 1, 1], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 4));
  g.setAttribute('tint', new THREE.BufferAttribute(tint, 3));
  const m = new THREE.ShaderMaterial({
    uniforms: starUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec4 seed; attribute vec3 tint;
      uniform float uTime, uPixel;
      varying vec3 vColor;
      void main() {
        // A faint, quick shimmer (about 8%), not a pulse: two fast waves at unrelated rates, so it never repeats evenly.
        float f = uTime * (3.0 + seed.z * 2.0) + seed.w;
        float tw = 1.0 + 0.05 * sin(f) + 0.03 * sin(f * 2.71 + seed.w * 3.0);
        vColor = tint * seed.y * tw;
        gl_PointSize = seed.x * uPixel;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uNight;
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = smoothstep(1.0, 0.0, d); a *= a;
        gl_FragColor = vec4(vColor * a * uNight, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  skyScene.add(p);
  return p;
})();
const sunDir = new THREE.Vector3(-70, 120, 60);   // from the subject toward the light; set by the time of day
let shadowHalf = 0;
function aimShadows() {
  // The light rides along with the point the camera looks at, and its shadow box grows with the camera's distance.
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).add(sunDir);
  const half = Math.min(140, Math.max(55, Math.round(camera.position.distanceTo(controls.target) * 1.15 / 5) * 5));
  if (half !== shadowHalf) { shadowHalf = half; Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half }); sun.shadow.camera.updateProjectionMatrix(); }
}

const texLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();
const loadGLB = (name) => new Promise((ok, fail) => gltfLoader.load(M + name + '.glb', (g) => ok(g.scene), undefined, fail));
// Textures that replace a glTF material's map must not be flipped.
const mapTex = (path, srgb = true) => { const t = texLoader.load(T + path); t.flipY = false; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
const tileTex = (path, repeat, srgb = true) => { const t = texLoader.load(T + path); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

function mulberry(seed) { return () => { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// A new map every load, as in the 2D game; ?seed=N rebuilds one.
const mapSeed = parseInt(new URLSearchParams(location.search).get('seed'), 10) || 1 + Math.floor(Math.random() * 1e9);
const rnd = mulberry(mapSeed);
console.log(`Map seed ${mapSeed}. Add ?seed=${mapSeed} to the URL to build this map again.`);

function shadows(obj, cast = true, receive = true) { obj.traverse((o) => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = receive; } }); return obj; }

// Wrap a model so that it stands on y = 0, is centred in x and z, and has the given size in metres.
// size: { height } or { width } scales evenly; { width, length } stretches x and z to fit and averages them for y.
function fit(model, size) {
  const box = new THREE.Box3().setFromObject(model), s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const g = new THREE.Group();
  model.position.set(-c.x, -box.min.y, -c.z);
  g.add(model);
  if (size.width && size.length) { const sx = size.width / s.x, sz = size.length / s.z; g.scale.set(sx, (sx + sz) / 2, sz); }
  else { const k = size.height ? size.height / s.y : size.width / s.x; g.scale.setScalar(k); }
  const wrap = new THREE.Group();
  wrap.add(g);
  return wrap;
}

// Radius of a model's footprint: the farthest any vertex in its bottom slice reaches from the centre, in metres.
// For a tree that is the spread of its roots; for a gravestone, its plinth.
function footRadius(obj, slice = 0.14) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj), top = box.min.y + (box.max.y - box.min.y) * slice, v = new THREE.Vector3();
  let r = 0;
  obj.traverse((o) => { if (!o.isMesh) return; const g = o.geometry.attributes.position; for (let i = 0; i < g.count; i++) { v.fromBufferAttribute(g, i).applyMatrix4(o.matrixWorld); if (v.y <= top) r = Math.max(r, Math.hypot(v.x, v.z)); } });
  return r;
}
const PAWN_R = 0.8;   // the walker is tested as a point, so every obstacle is grown by the walker's own radius

// Give a clone its own materials so a texture swap on one home does not change the others.
function ownMaterials(obj) { obj.traverse((o) => { if (o.isMesh) o.material = o.material.clone(); }); return obj; }
function eachMaterial(obj, fn) { obj.traverse((o) => { if (o.isMesh) fn(o.material); }); }

const status = document.getElementById('status');
const lit = [];   // materials whose glow follows the day and night switch

async function build() {
  const names = ['house', 'house_door', 'crypt', 'crypt_door', 'church', 'tombstone_a', 'tombstone_b', 'tombstone_c', 'tree_a', 'tree_b', 'bush', 'bridge_span', 'bridge_abutment', 'bridge_pier', 'road_straight', 'river_straight'];
  const loaded = {};
  await Promise.all(names.map(async (n) => { loaded[n] = await loadGLB(n); status.textContent = `Loading models (${Object.keys(loaded).length}/${names.length})`; }));
  status.textContent = '';
  // The generated materials are marked fully metallic, which renders near black without reflections. Nothing here is metal.
  Object.values(loaded).forEach((m) => eachMaterial(m, (mat) => { mat.metalness = 0; mat.metalnessMap = null; if (mat.name === 'riverbed') mat.normalScale.set(2.2, 2.2); if (!mat.transparent) mat.roughness = Math.max(mat.roughness, 0.85); }));

  // Water: the model's water is one flat sheet. Drifting ripples bend its normals so highlights break into glints,
  // it picks up the sky colour (more at grazing angles), and it is clearer near the banks than in the deep middle.
  eachMaterial(loaded.river_straight, (m) => {
    if (m.name !== 'water') return;
    m.roughness = 0.22;
    // Little colour of its own: dark teal in the deep middle, a clear green tint over the shallows.
    Object.assign(waterUniforms, { uDeep: { value: new THREE.Color(0.012, 0.05, 0.07) }, uShallow: { value: new THREE.Color(0.05, 0.12, 0.1) } });
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, waterUniforms);
      sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
varying vec3 vWaterPos;`).replace('#include <begin_vertex>', `#include <begin_vertex>
vWaterPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying vec3 vWaterPos;
uniform float uTime, uHalf;
uniform vec3 uSky, uDeep, uShallow;
// Gradient noise with quintic smoothing: no creases along its grid, unlike value noise.
// The hash avoids sin() of large numbers: rounding there gave a lattice corner different gradients from its
// neighbouring cells, which drew straight seams along the cell edges.
vec2 wGrad(vec2 i) {
  i = mod(i, 256.0);
  vec3 p3 = fract(vec3(i.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  float a = fract((p3.x + p3.y) * p3.z) * 6.2832;
  return vec2(cos(a), sin(a));
}
float wNoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(wGrad(i), f), b = dot(wGrad(i + vec2(1, 0)), f - vec2(1, 0));
  float c = dot(wGrad(i + vec2(0, 1)), f - vec2(0, 1)), d = dot(wGrad(i + vec2(1, 1)), f - vec2(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// Ripple height: three octaves drifting downstream (-z), each turned to its own angle so no grid direction shows,
// on a gently warped domain so the ripples curve.
float wHeight(vec2 p) {
  float t = uTime;
  p += 0.6 * vec2(wNoise(p * 0.15 + vec2(0.0, t * 0.05)), wNoise(p * 0.15 + vec2(5.2, t * 0.05)));
  const mat2 R1 = mat2(0.87, 0.5, -0.5, 0.87), R2 = mat2(0.34, 0.94, -0.94, 0.34), R3 = mat2(-0.42, 0.91, -0.91, -0.42);
  return 0.55 * wNoise(R1 * (p * vec2(0.5, 0.35) + vec2(0.0, t * 0.22)))
       + 0.30 * wNoise(R2 * (p * vec2(1.2, 0.9) + vec2(t * 0.05, t * 0.45)))
       + 0.15 * wNoise(R3 * (p * vec2(2.7, 2.3) + vec2(-t * 0.08, t * 0.8)));
}`).replace('#include <color_fragment>', `#include <color_fragment>
float wDeep = 1.0 - smoothstep(0.3, 1.0, clamp(abs(vWaterPos.x) / uHalf, 0.0, 1.0));
diffuseColor.rgb = mix(uShallow, uDeep, wDeep);
diffuseColor.a = mix(0.25, 0.75, wDeep);`).replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{ vec2 p = vWaterPos.xz; float e = 0.05;
  float hx = (wHeight(p + vec2(e, 0.0)) - wHeight(p - vec2(e, 0.0))) / (2.0 * e);
  float hz = (wHeight(p + vec2(0.0, e)) - wHeight(p - vec2(0.0, e))) / (2.0 * e);
  normal = normalize((viewMatrix * vec4(normalize(vec3(-hx * 0.45, 1.0, -hz * 0.45)), 0.0)).xyz); }`).replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
{ float fres = pow(1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0), 3.0);
  totalEmissiveRadiance += uSky * (0.02 + 0.3 * fres); }`);
    };
  });

  let night = 0;   // 0 in full daylight, 1 in full night; set by the time slider

  // ---- Layout: drawn from the map seed, by the 2D game's rules ----
  // The river runs north to south through the middle. Each road crosses it at a random point and angle, steep enough
  // for a short bridge, and the two bridges stay well apart. The house of worship stands at the far side of one bank
  // and the graveyard at the far side of the other; homes go anywhere dry, off the roads and apart. A draw that does
  // not fit is redrawn.
  // A road is a line through `at` with heading `deg` (0 runs east to west, straight across the river).
  const HILL = 2, HOMES = 13;
  let roads, homes, churchAt, yard;
  const lineDist = (r, x, z) => { const a = r.deg * Math.PI / 180; return Math.abs((x - r.at[0]) * Math.sin(a) - (z - r.at[1]) * Math.cos(a)); };
  const roadDist = (x, z) => Math.min(...roads.map((r) => lineDist(r, x, z)));
  const KINDS = ['yellow', 'yellow', 'yellow', 'yellow', 'clean', 'clean', 'red', 'decayed', 'decayedOrange', 'decayedRed'];
  for (let attempt = 0; ; attempt++) {
    if (attempt > 500) throw new Error(`No layout fits seed ${mapSeed}`);
    roads = [0, 1].map(() => ({ at: [0, -40 + rnd() * 80], deg: (rnd() * 2 - 1) * 38 }));
    if (Math.abs(roads[0].at[1] - roads[1].at[1]) < 24) continue;   // bridges at least 8 tiles apart
    const ta = Math.tan(roads[0].deg * Math.PI / 180), tb = Math.tan(roads[1].deg * Math.PI / 180);
    if (Math.abs(ta - tb) > 1e-3 && Math.abs((roads[1].at[1] - roads[0].at[1]) / (ta - tb)) < RIVER_HALF + 25) continue;   // roads must not meet at a bridge
    const bank = rnd() < 0.5 ? 1 : -1;
    churchAt = [bank * (56 + rnd() * 16), -46 + rnd() * 92];
    if (roads.some((r) => lineDist(r, ...churchAt) < 18)) continue;
    yard = { x: -bank * (50 + rnd() * 14), z: -38 + rnd() * 76, w: 32, d: 28 };
    let yardClear = true;
    for (let u = -1; u <= 1.001; u += 0.25) for (let w = -1; w <= 1.001; w += 0.25) if (roadDist(yard.x + u * (yard.w / 2 + 4), yard.z + w * (yard.d / 2 + 4)) < ROAD_HALF + 4) yardClear = false;
    if (!yardClear) continue;
    homes = [];
    for (let tries = 0; tries < 800 && homes.length < HOMES; tries++) {
      const side = rnd() < 0.5 ? 1 : -1, x = side * (RIVER_HALF + 12 + rnd() * (80 - RIVER_HALF - 12)), z = -50 + rnd() * 100;
      if (roadDist(x, z) < 10) continue;
      if (Math.hypot(x - churchAt[0], z - churchAt[1]) < 24) continue;
      if (Math.abs(x - yard.x) < yard.w / 2 + 8 && Math.abs(z - yard.z) < yard.d / 2 + 8) continue;
      if (homes.some(([hx, hz]) => Math.hypot(x - hx, z - hz) < 16)) continue;
      homes.push([x, z, KINDS[Math.floor(rnd() * KINDS.length)]]);
    }
    if (homes.length < HOMES) continue;
    const decayed = homes.filter((h) => h[2] === 'decayed');
    if (decayed.length) decayed[Math.floor(rnd() * decayed.length)][3] = true;   // one empty home with its door open
    break;
  }
  const NX = rnd() * 100, NZ = rnd() * 100;   // shifts the terrain noise, so the hills differ too

  // ---- Terrain height ----
  // Rolling ground: broad swells of a few metres with smaller bumps on top, sinking to the river banks. The house of
  // worship stands on a 2 m hill and the graveyard on a lower, wider rise. Roads run on raised embankments that follow
  // the land, level across their width. The ground is level under every building.

}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (window.onRenderScale) window.onRenderScale(); });
// Camera sliders: angle is degrees below level (90 is straight down), zoom is the distance to the point looked at.
// They drive the orbit camera, and they follow it when the mouse changes the view.
const camAngle = document.getElementById('camAngle'), camZoom = document.getElementById('camZoom'), camState = document.getElementById('camState');
const sph = new THREE.Spherical(), camOff = new THREE.Vector3();
function applyCamSliders() {
  sph.setFromVector3(camOff.copy(camera.position).sub(controls.target));
  sph.phi = (90 - +camAngle.value) * Math.PI / 180; sph.radius = +camZoom.value;
  camera.position.copy(controls.target).add(camOff.setFromSpherical(sph));
  showCam();
}
function showCam() {
  const widthM = 2 * +camZoom.value * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  camState.textContent = `${camAngle.value} degrees down (${90 - camAngle.value} off vertical), ${camZoom.value} m away, about ${Math.round(widthM)} m wide (${Math.round(widthM / 3)} tiles)`;
}
camAngle.addEventListener('input', applyCamSliders); camZoom.addEventListener('input', applyCamSliders);
for (const el of [camAngle, camZoom]) el.addEventListener('change', () => el.blur());   // let go, so mouse orbiting can update the slider again
window.syncCamSliders = () => {
  if (document.activeElement === camAngle || document.activeElement === camZoom) return;
  sph.setFromVector3(camOff.copy(camera.position).sub(controls.target));
  const a = Math.round(90 - sph.phi * 180 / Math.PI), z = Math.round(sph.radius);
  if (+camAngle.value !== a || +camZoom.value !== z) { camAngle.value = a; camZoom.value = z; showCam(); }
};
showCam();
// Settings panel: the button or the H key folds it down to a single small button.
const panel = document.getElementById('panel'), panelToggle = document.getElementById('panelToggle');
function togglePanel() {
  const min = panel.classList.toggle('min');
  panelToggle.textContent = min ? 'Settings' : 'Hide'; panelToggle.setAttribute('aria-expanded', String(!min)); panelToggle.blur();
  try { localStorage.setItem('scene3d.panel', min ? 'hidden' : 'open'); } catch (e) { /* storage is optional */ }
}
panelToggle.addEventListener('click', togglePanel);
addEventListener('keydown', (e) => { if (e.code === 'KeyH' && !e.ctrlKey && !e.metaKey && !e.altKey) togglePanel(); });
try { if (localStorage.getItem('scene3d.panel') === 'open') togglePanel(); } catch (e) { /* storage is optional */ }   // hidden unless the viewer opened it last time
// Tilt-shift (SPEC-3D section 7): a screen-space blur that grows toward the top and bottom of the view, leaving a
// sharp band across the middle 40% centred on the player's screen row. Two passes, horizontal then vertical, 21
// samples each. The second pass also lifts saturation by 15% and adds a slight vignette. Tone mapping comes last.
const TiltShift = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uFocus: { value: 0.5 }, uRadius: { value: 0.007 }, uGrade: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uDir; uniform float uFocus, uRadius, uGrade; varying vec2 vUv;
    void main() {
      float amt = smoothstep(0.13, 0.42, abs(vUv.y - uFocus));   // 0 inside the sharp band (the middle quarter), 1 toward the edge
      // 21 taps, so neighbouring samples sit under two pixels apart and hard edges such as roof lines stay smooth
      vec2 stepUv = uDir * uRadius * amt / 10.0;
      vec4 c = texture2D(tDiffuse, vUv); float wSum = 1.0;
      for (int k = 1; k <= 10; k++) {
        float f = float(k), w = exp(-f * f / 40.5);
        c += (texture2D(tDiffuse, vUv + stepUv * f) + texture2D(tDiffuse, vUv - stepUv * f)) * w; wSum += 2.0 * w;
      }
      c /= wSum;
      if (uGrade > 0.5) {
        float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
        c.rgb = max(vec3(0.0), mix(vec3(l), c.rgb, 1.15));

      }
      gl_FragColor = c;
    }`,
};
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const blurH = new ShaderPass(TiltShift), blurV = new ShaderPass(TiltShift);
blurV.uniforms.uGrade.value = 1;
// The blur passes leave depth alone, so the star pass after them is still hidden by the town.
for (const b of [blurH, blurV]) { b.material.depthTest = false; b.material.depthWrite = false; }
const starPass = new RenderPass(skyScene, camera);
starPass.clear = false;
composer.addPass(blurH); composer.addPass(blurV); composer.addPass(starPass); composer.addPass(new OutputPass());
composer.setPixelRatio(renderScale); composer.setSize(innerWidth, innerHeight);
const tiltBox = document.getElementById('tilt'), tiltStrength = document.getElementById('tiltStrength'), focusPoint = new THREE.Vector3();
renderer.info.autoReset = false;   // so the triangle count covers the scene, not just the last full-screen pass
function drawFrame() {
  renderer.info.reset();
  renderer.toneMappingExposure = baseExposure * +brightSlider.value;
  if (!tiltBox.checked) {
    renderer.render(scene, camera);
    renderer.autoClear = false; renderer.render(skyScene, camera); renderer.autoClear = true;
    return;
  }
  // The sharp band follows the player's row on screen (the camera's subject when nobody is walking).
  focusPoint.copy(window.sceneDebug && window.sceneDebug.pawn ? window.sceneDebug.pawn.position : controls.target).project(camera);
  const focus = Math.min(0.8, Math.max(0.2, focusPoint.y * 0.5 + 0.5)), radius = 0.007 * +tiltStrength.value;   // 0.7% of the view height at strength 1
  blurH.uniforms.uFocus.value = blurV.uniforms.uFocus.value = focus;
  blurH.uniforms.uDir.value.set(innerHeight / innerWidth, 0); blurV.uniforms.uDir.value.set(0, 1);
  blurH.uniforms.uRadius.value = blurV.uniforms.uRadius.value = radius;
  // With autoClear on, every full-screen pass would also clear the depth the star pass needs.
  // The first render pass still clears its target itself.
  renderer.autoClear = false; composer.render(); renderer.autoClear = true;
}
window.onRenderScale = () => { composer.setPixelRatio(renderScale); composer.setSize(innerWidth, innerHeight); };
window.preview = { scene, camera, controls, renderer };
// Loading screen: tracks every model and texture, and lifts only once the scene has been compiled and drawn.
const loading = document.getElementById('loading'), loadFill = document.getElementById('loadFill'), loadText = document.getElementById('loadText');
let filesIdle = false;
THREE.DefaultLoadingManager.onProgress = (url, done, total) => { filesIdle = false; loadFill.style.width = Math.round(100 * done / total) + '%'; loadText.textContent = `Loading the town (${done} of ${total} files)`; };
THREE.DefaultLoadingManager.onStart = () => { filesIdle = false; };
THREE.DefaultLoadingManager.onLoad = () => { filesIdle = true; };
build().then(async () => {
  while (!filesIdle) await new Promise((r) => setTimeout(r, 50));   // textures requested during the build
  loadFill.style.width = '100%'; loadText.textContent = 'Preparing the scene';
  await new Promise((r) => setTimeout(r, 30));
  if (renderer.compileAsync) await renderer.compileAsync(scene, camera); else renderer.compile(scene, camera);
  renderer.render(scene, camera);
  await new Promise((r) => setTimeout(r, 150));
  while (!filesIdle) await new Promise((r) => setTimeout(r, 50));   // anything the first draw asked for
  renderer.render(scene, camera);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  loading.classList.add('done'); setTimeout(() => loading.remove(), 700);
  document.title = 'ready: ' + document.title;
}).catch((e) => { loadText.textContent = 'Failed to load: ' + (e.message || e); status.textContent = loadText.textContent; console.error(e); });
tick();
</script>
