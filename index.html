<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vampire Simulator</title>
<script>
  // ?view=2d plays the original flat view, with its own top bar and footer drawn on the canvas.
  const VIEW_2D = new URLSearchParams(location.search).get('view') === '2d';
  document.documentElement.classList.toggle('view2d', VIEW_2D);
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #e8e4da; }
  #view3d { position: fixed; inset: 0; display: block; }
  /* Talk, death and end panels, drawn at 1280 by 720 and scaled to fit over the scene. */
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; pointer-events: none; z-index: 7; }
  #bars { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .bar3d { position: absolute; left: -32px; top: -5px; width: 64px; height: 8px; background: rgba(10, 8, 14, .75); border: 1px solid rgba(232, 228, 218, .7); border-radius: 4px; overflow: hidden; }
  .bar3d i { display: block; height: 100%; }
  #loading { position: fixed; inset: 0; z-index: 10; background: #0d0f14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .6s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0; font: 600 28px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .04em; color: #e8e4da; }
  #loading .bar { width: min(320px, 70vw); height: 6px; background: #221d27; border: 1px solid #4b3f2c; border-radius: 4px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0; background: #b3141c; transition: width .2s ease; }
  #loadText { color: #a99f8c; font-size: 12px; min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { #loading, #loading .fill { transition: none; } }
  .view2d body { display: flex; align-items: center; justify-content: center; background: #0b0b10; }
  .view2d #c { position: static; width: auto; height: auto; max-width: 100vw; max-height: 100vh; background: #000; }
  .view2d .hud, .view2d #loading, .view2d #bars { display: none; }
</style>
<link rel="stylesheet" href="assets/hud/hud.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="hud" aria-label="Game status">
  <header class="hud-bar hud-top" aria-label="Town status">
    <div class="hud-night"><span class="hud-sprite hud-moon" aria-hidden="true"></span><strong id="hudNight">Night 1</strong></div>
    <div class="hud-clock" role="img" aria-label="Night and day cycle"><i class="hud-pointer" aria-hidden="true"></i></div>
    <div class="hud-countdown"><span id="hudCountdown">Dawn in 55s</span></div>
    <div class="hud-stat hud-homes"><span class="hud-sprite hud-house" aria-hidden="true"></span><div><span><b id="hudClean">16</b> Clean</span><span class="cursed"><b id="hudCursed">0</b> Cursed</span></div></div>
    <div class="hud-stat"><span class="hud-sprite hud-bat" aria-hidden="true"></span><span>Vampires <b id="hudVampires">0</b></span></div>
    <div class="hud-stat"><span class="hud-sprite hud-hat" aria-hidden="true"></span><span>Hunters <b id="hudHunters">1</b></span></div>
    <div class="hud-stat hud-hunger"><span>Hunger</span><div class="hud-pips" role="img" aria-label="Blood: 3 of 3, fully fed"><i class="full"></i><i class="full"></i><i class="full"></i></div></div>
  </header>
  <footer class="hud-bar hud-footer" aria-label="Current location">
    <span class="hud-sprite hud-crest" aria-hidden="true"></span>
    <div class="hud-context" role="status"><div class="hud-title-row"><h1 class="hud-title" id="hudTitle">The Crypt</h1><div class="hud-action" aria-label="Action prompt"><kbd><span id="hudActionKey">E</span></kbd><span id="hudActionVerb">Enter</span></div><span class="hud-speed" id="hudSpeed"></span></div><p class="hud-description" id="hudDescription"></p></div>
    <div class="hud-rule" aria-hidden="true"></div>
    <div class="hud-movement" aria-label="W A S D or arrow keys to move"><div class="hud-keys" aria-hidden="true"><kbd><span>W</span></kbd><kbd><span>A</span></kbd><kbd><span>S</span></kbd><kbd><span>D</span></kbd></div><span>Move</span></div>
  </footer>
</div>
<div id="bars"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="loading" role="status" aria-live="polite">
  <h1>Vampire Simulator</h1>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div id="loadText">Loading the town</div>
</div>
<script src="sim.js"></script>
<script src="render2d.js"></script>
<script src="ui.js"></script>
<script src="assets/hud/hud.js"></script>
<script src="main.js"></script>
<script>if (!VIEW_2D) { const s = document.createElement('script'); s.type = 'module'; s.src = 'render3d.js'; document.body.appendChild(s); }</script>
</body>
</html>
